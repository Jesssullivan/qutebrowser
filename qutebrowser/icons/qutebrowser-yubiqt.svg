<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="trans-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BCEFA"/>
      <stop offset="25%" stop-color="#F5A9B8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F5A9B8"/>
      <stop offset="100%" stop-color="#5BCEFA"/>
    </linearGradient>
    <linearGradient id="planet-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F5A9B8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5BCEFA" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2a1a3a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle with trans flag gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#trans-bg)" filter="url(#shadow)"/>

  <!-- Planet body -->
  <circle cx="128" cy="128" r="95" fill="url(#planet-grad)"/>

  <!-- Continent shapes (stylized) -->
  <g fill="#FFFFFF" fill-opacity="0.35">
    <!-- Americas-ish -->
    <path d="M85 60 Q75 75 78 95 Q82 110 75 125 Q68 140 72 160 Q78 175 85 170 Q92 160 88 145 Q95 130 100 120 Q105 105 98 85 Q92 70 85 60Z"/>
    <!-- Europe/Africa-ish -->
    <path d="M145 55 Q155 65 158 80 Q162 95 155 110 Q150 120 155 135 Q160 150 155 165 Q148 175 142 168 Q135 155 140 140 Q145 125 140 110 Q135 95 140 75 Q142 62 145 55Z"/>
    <!-- Australia-ish -->
    <path d="M170 150 Q180 155 185 165 Q182 175 175 172 Q168 168 170 158Z"/>
  </g>

  <!-- Glow overlay -->
  <circle cx="128" cy="128" r="95" fill="url(#glow)"/>

  <!-- Letterform "q" -->
  <g fill="#2a1a3a">
    <!-- Main "q" body -->
    <path d="M108 88 C88 88 72 106 72 128 C72 150 88 168 108 168 L118 168 L118 195 C118 200 122 204 128 204 C134 204 138 200 138 195 L138 168 C158 168 174 150 174 128 C174 106 158 88 138 88 Z M128 148 C114.7 148 104 137.3 104 124 C104 110.7 114.7 100 128 100 C141.3 100 152 110.7 152 124 C152 137.3 141.3 148 128 148Z"/>
  </g>

  <!-- Key icon (FIDO2/YubiKey reference) -->
  <g transform="translate(178, 68) scale(0.5)" fill="#2a1a3a" fill-opacity="0.7">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#2a1a3a" stroke-width="5" stroke-opacity="0.7"/>
    <rect x="30" y="16" width="28" height="8" rx="2"/>
    <rect x="50" y="10" width="4" height="14" rx="1"/>
    <rect x="42" y="12" width="4" height="12" rx="1"/>
  </g>
</svg>
